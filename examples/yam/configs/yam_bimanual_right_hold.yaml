# Primary configuration for the released MolmoAct2-BimanualYAM checkpoint.
#
# The checkpoint's state/action convention is fixed:
#   fields 0:7  = physical left arm (can_left)
#   fields 7:14 = physical right arm (can_right)
#
# Use this file with ``--right-config-path yam_right_primary.yaml``.  Its
# default execution mode is ``shadow``: both arms receive their current
# encoder positions, while the model still runs and records full 14-D policy
# outputs.  That validates the cameras, state ordering, and right-arm action
# half without intentionally moving either arm.  To perform the first active
# right-arm test, add ``--execution-mode active_arm_hold`` explicitly.
model_arm_side: left

sensors:
  # Physical side convention: left/right while standing behind the arms and
  # facing into the workspace.
  cameras:
    left_camera:
      # D405 serial 402323071792 (left wrist view / model ``left_cam``)
      device_id: "/dev/yam-cameras/left"
    front_camera:
      # D435 serial 250423122040 (static overhead view / model ``top_cam``)
      device_id: "/dev/yam-cameras/middle"
    right_camera:
      # D405 serial 402323071794 (right wrist view / model ``right_cam``)
      device_id: "/dev/yam-cameras/right"

robot:
  _target_: gello_min.yam.YAMRobot
  channel: can_left

agent:
  start_joints: null

hz: 30
# A 1,000-step run is roughly 33 s of commanded control time at 30 Hz.  The
# policy replans in 30-action chunks, so wall time also includes inference.
max_steps: 1000

storage:
  base_dir: "./yam_eval_runs"
  task_directory: "red_lid_right_arm_bimanual"
  language_instruction: "Using the right arm, pick up the red lid, place it fully on top of the black box, open the gripper to release it, then move the arm away."
  saver_max_workers: 2
  png_compress_level: 1

lerobot:
  fps: 30
  robot_type: "molmoact_bimanual_right_hold"
  hf_repo_id: "local/yam_eval_session"
  action_mode: "next_joint_fields"
  vcodec: "libx264"
  image_writer_processes: 2
  image_writer_threads: 2
  parallel_encoding: false
  sanitize_online_viz_meta: true

eval:
  # Keep the model's native [left(7), right(7)] state/action interface.  The
  # launcher only permits an explicit active arm and starts shadow-only.
  bimanual:
    active_arm_side: right
    execution_mode: shadow
  live_view_enabled: false
  reproducibility:
    seed: 20260727
    deterministic_algorithms: false
  # Gate motor enable on two well-exposed, correctly-sized policy frames.
  camera_preflight:
    enabled: true
    timeout_sec: 10
    min_warmup_sec: 2.0
    required_consecutive_frames: 2
    expected_shape: [360, 640, 3]
    max_clipped_white_fraction: 0.15
  rerun:
    enabled: true
    image_stride: 6
    jpeg_quality: 75
    action_chunk_size: 30
  mode: local
  local:
    repo_id: "allenai/MolmoAct2-BimanualYAM"
    device: "cuda:0"
    dtype: "bfloat16"
    num_steps: 10
    enable_cuda_graph: false
    warmup: true
  camera_server:
    enabled: false
