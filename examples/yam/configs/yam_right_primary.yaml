# This config must be supplied as --right-config-path for the BimanualYAM
# model: state/action fields 7:14 are the physical right arm.
model_arm_side: right

sensors:
  # Physical side convention: left/right while standing behind the arms and
  # facing into the workspace.
  cameras:
    left_camera:
      # D405 serial 402323071792 (left wrist view / model ``left_cam``)
      device_id: "/dev/yam-cameras/left"
    front_camera:
      # D435 serial 250423122040 (static overhead view / model ``top_cam``)
      device_id: "/dev/yam-cameras/middle"
    right_camera:
      # D405 serial 402323071794 (right wrist view)
      device_id: "/dev/yam-cameras/right"

robot:
  _target_: gello_min.yam.YAMRobot
  channel: can_right

agent:
  start_joints: null

hz: 30
# Full physical-task horizon: 3000 control steps at 30 Hz (~100 s of action
# execution, plus replan pauses between 30-action chunks).
max_steps: 3000

storage:
  base_dir: "./yam_eval_runs"
  task_directory: "red_lid_right_arm"
  language_instruction: "Using the right arm, pick up the red lid, place it fully on top of the black box, open the gripper to release it, then move the arm away."
  saver_max_workers: 2
  png_compress_level: 1

lerobot:
  fps: 30
  robot_type: "molmoact_right_arm"
  hf_repo_id: "local/yam_eval_session"
  action_mode: "next_joint_fields"
  vcodec: "libx264"
  image_writer_processes: 2
  image_writer_threads: 2
  parallel_encoding: false
  sanitize_online_viz_meta: true

eval:
  live_view_enabled: false
  # Gate motor enable on two well-exposed, correctly-sized policy frames.
  camera_preflight:
    enabled: true
    timeout_sec: 10
    min_warmup_sec: 2.0
    required_consecutive_frames: 2
    expected_shape: [360, 640, 3]
    max_clipped_white_fraction: 0.15
  # A detached, camera/CAN-free exporter is armed before robot startup. After
  # the launcher exits it atomically writes rollout.rrd from raw PNG/HDF5.
  rerun:
    enabled: true
    image_stride: 6
    jpeg_quality: 75
    action_chunk_size: 30
  mode: local
  local:
    repo_id: "allenai/MolmoAct2-BimanualYAM"
    device: "cuda:0"
    dtype: "bfloat16"
    # Use the released checkpoint's quality default. Lowering this to five
    # solver steps trades away action quality, not merely latency.
    num_steps: 10
    enable_cuda_graph: false
    warmup: true
  camera_server:
    enabled: false
